name: PR87 rustfmt audit (temporary)
on:
  pull_request:
    paths:
      - 'crates/app/src/**'
      - '.github/workflows/pr87-rustfmt-audit.yml'
permissions:
  contents: read
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Show rustfmt changes
        run: |
          cargo fmt --all
          printf '\nPR87_RUSTFMT_PATCH_BEGIN\n'
          git --no-pager diff --no-ext-diff --no-color --unified=3 -- crates/app/src
          printf '\nPR87_RUSTFMT_PATCH_END\n'
